<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Page Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur ma page</h1>
    </header>
    <main>
        <h2>Introduction</h2>
        <p>Ceci est une page HTML simple. Tu peux personnaliser ce contenu comme tu le souhaites.</p>
        <p>Ajoute des éléments comme des images, des liens, ou même des formulaires !</p>
    </main>
    <footer>
        <p>Page créée par ChatGPT - 2025</p>
    </footer>
</body>
</html>
